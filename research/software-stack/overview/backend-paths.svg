<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="906" viewBox="0 0 1080 906" role="img" aria-labelledby="title desc">
<title id="title">程序表示与后端分支</title>
<desc id="desc">matmul + jit / grad / vmap → Jaxpr 与 primitive 规则；Jaxpr 与 primitive 规则 → JAX MLIR lowering：StableHLO / sdy；JAX MLIR lowering：StableHLO / sdy → jaxlib / IFRT / PJRT 编译接口；jaxlib / IFRT / PJRT 编译接口 → CPU：MLIR 导入与 HLO passes；CPU：MLIR 导入与 HLO passes → schedule / buffer assignment；schedule / buffer assignment → CPU emitter：MLIR / LLVM IR / runtime 调用；CPU emitter：MLIR / LLVM IR / runtime 调用 → 原生代码与 executable；原生代码与 executable → CPU load / execute；jaxlib / IFRT / PJRT 编译接口 → TPU PJRT C API / libtpu plugin；TPU PJRT C API / libtpu plugin → 待取得匹配证据： TPU 编译器、LLO 与 runtime；待取得匹配证据： TPU 编译器、LLO 与 runtime → 待验证：指定 TPU 硬件执行</desc>
