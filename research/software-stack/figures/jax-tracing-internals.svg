<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2800" viewBox="0 0 2000 2800" role="img" aria-labelledby="title desc">
<title id="title">JAX tracing 的源码实现：Python、Tracer、Trace 与 Jaxpr</title>
<desc id="desc">沿固定 JAX 0.11.1 源码，展开创建 DynamicJaxprTrace、构造输入 Tracer、调用 Python 函数、Primitive.bind 分派、抽象求值、记录 TracingEqn、返回输出 Tracer和汇总 Jaxpr 的循环。区分当前 Trace 与 Tracer 内的引用，并列出普通求值、自动微分、批量化等其他解释器。</desc>
<defs>
<marker id="flow-head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#42658c"/></marker>
<marker id="return-head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#208779"/></marker>
</defs>
