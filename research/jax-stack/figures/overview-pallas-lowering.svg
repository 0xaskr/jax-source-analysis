<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="906" viewBox="0 0 1080 906" role="img" aria-labelledby="title desc">
<title id="title">Pallas 的两层表示</title>
<desc id="desc">Pallas kernel：Ref / grid / BlockSpec → kernel Jaxpr；kernel Jaxpr → lowering 方式；lowering 方式 → 解释实现 lower 到可执行后端； 可在 CPU 验证；lowering 方式 → lower_jaxpr_to_pipelined_module；lower_jaxpr_to_pipelined_module → 内层 Mosaic TPU MLIR；内层 Mosaic TPU MLIR → 序列化配置与 custom call 接口；序列化配置与 custom call 接口 → 外层 StableHLO：tpu_custom_call；外层 StableHLO：tpu_custom_call → 外层 module 经 PJRT / libtpu；外层 module 经 PJRT / libtpu → Mosaic 到 TPU LLO：待匹配编译器证据</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:18px;fill:#172b4d}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.node{fill:#eff6ff;stroke:#7098c4;stroke-width:1.5}.pending{fill:#fff7ed;stroke:#c58a40;stroke-width:1.5;stroke-dasharray:6 4}</style>
