[project]
name = "jax-source-analysis"
version = "0.1.0"
description = "Reproducible environment for analyzing the pinned JAX source tree"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "jax",
  "jaxlib==0.11.1",
  "marimo",
]

[tool.uv]
package = false
required-version = "==0.12.9"

[tool.uv.sources]
jax = { path = "upstream/jax", editable = true }

[dependency-groups]
notebook = [
    "ipywidgets>=8,<9",
    "jupyterlab==4.6.2",
]
